name: Build SCORM 2022

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble SCORM package
        run: |
          set -e
          rm -rf scorm-2022
          mkdir -p scorm-2022/modules/2022
          cp imsmanifest.xml launch-2022.html index.html module-router.js module-fixes.js modules.css styles.css learning.css practice.css practice.js practice-numbers.js scorm.js app-2022.js resume-2022.js rewards.js attempt-lock.js scorm-2022/
          cp modules/2022/tasks.js scorm-2022/modules/2022/
          cd scorm-2022
          zip -r ../Helyesiras_gyakorlas_2022_SCORM12.zip .
      - name: Verify ZIP root
        run: |
          unzip -Z1 Helyesiras_gyakorlas_2022_SCORM12.zip | grep -x "imsmanifest.xml"
          unzip -Z1 Helyesiras_gyakorlas_2022_SCORM12.zip | grep -x "modules/2022/tasks.js"
      - uses: actions/upload-artifact@v4
        with:
          name: Helyesiras_gyakorlas_2022_SCORM12
          path: Helyesiras_gyakorlas_2022_SCORM12.zip
          if-no-files-found: error
