name: Build Szolasok 2026 SCORM

on:
  push:
    paths:
      - ".github/workflows/build-szolasok-2026-scorm.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble SCORM package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/szolasok-2026-scorm"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/categories/szolasok/2026/img"

          cp styles.css "$STAGE/"
          cp modules.css "$STAGE/"
          cp scorm.js "$STAGE/"
          cp categories/szolasok/2026/tasks.js "$STAGE/categories/szolasok/2026/"
          cp categories/szolasok/app.js "$STAGE/categories/szolasok/"

          cp categories/szolasok/2026/img/a-agyuval-lo-verebre.png "$STAGE/categories/szolasok/2026/img/"
          cp categories/szolasok/2026/img/b-vakok-kozott-felszemu-kiraly.png "$STAGE/categories/szolasok/2026/img/"
          cp categories/szolasok/2026/img/c-ehes-diszno-makkal-almodik.png "$STAGE/categories/szolasok/2026/img/"
          cp categories/szolasok/2026/img/d-egy-talbol-cseresznyeznek.png "$STAGE/categories/szolasok/2026/img/"
          cp categories/szolasok/2026/img/e-lapatra-tesz.png "$STAGE/categories/szolasok/2026/img/"
          cp categories/szolasok/2026/img/f-bolhabol-elefantot-csinal.png "$STAGE/categories/szolasok/2026/img/"

          cat > "$STAGE/launch-szolasok-2026.html" <<'EOF'
          <!doctype html>
          <html lang="hu">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Felvételi tréner – Szólások és közmondások 2026</title>
            <link rel="stylesheet" href="styles.css">
            <link rel="stylesheet" href="modules.css">
          </head>
          <body>
            <div class="app-shell">
              <header class="topbar">
                <div>
                  <p class="eyebrow">Felvételi tréner</p>
                  <h1>Szólások és közmondások 2026</h1>
                </div>
                <div class="scoreboard" aria-label="Haladás és pontszám">
                  <div><span id="progressText">0 / 15</span><small>feladat</small></div>
                  <div><span id="scoreText">0 / 14</span><small>eddigi pont</small></div>
                  <div><span id="totalText">14</span><small>összes pont</small></div>
                </div>
              </header>

              <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
              <main id="app" class="card" aria-live="polite"></main>
            </div>

            <script>
              window.SZOLASOK_SCORM_STANDALONE = true;
            </script>
            <script src="scorm.js"></script>
            <script src="categories/szolasok/2026/tasks.js"></script>
            <script src="categories/szolasok/app.js"></script>
          </body>
          </html>
          EOF

          cat > "$STAGE/imsmanifest.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest identifier="felveteli-trener-szolasok-2026"
            version="1.0"
            xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2"
            xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://www.imsproject.org/xsd/imscp_rootv1p1p2 imscp_rootv1p1p2.xsd
                                http://www.adlnet.org/xsd/adlcp_rootv1p2 adlcp_rootv1p2.xsd">
            <organizations default="ORG1">
              <organization identifier="ORG1">
                <title>Felvételi tréner – Szólások és közmondások 2026</title>
                <item identifier="ITEM1" identifierref="RES1">
                  <title>Szólások és közmondások 2026</title>
                </item>
              </organization>
            </organizations>
            <resources>
              <resource identifier="RES1" type="webcontent" adlcp:scormtype="sco" href="launch-szolasok-2026.html">
                <file href="launch-szolasok-2026.html"/>
                <file href="styles.css"/>
                <file href="modules.css"/>
                <file href="scorm.js"/>
                <file href="categories/szolasok/2026/tasks.js"/>
                <file href="categories/szolasok/app.js"/>
                <file href="categories/szolasok/2026/img/a-agyuval-lo-verebre.png"/>
                <file href="categories/szolasok/2026/img/b-vakok-kozott-felszemu-kiraly.png"/>
                <file href="categories/szolasok/2026/img/c-ehes-diszno-makkal-almodik.png"/>
                <file href="categories/szolasok/2026/img/d-egy-talbol-cseresznyeznek.png"/>
                <file href="categories/szolasok/2026/img/e-lapatra-tesz.png"/>
                <file href="categories/szolasok/2026/img/f-bolhabol-elefantot-csinal.png"/>
              </resource>
            </resources>
          </manifest>
          EOF

          cd "$STAGE"
          zip -r "$GITHUB_WORKSPACE/Szolasok_kozmondasok_2026_SCORM12.zip" . -x "*.DS_Store"

      - name: Upload SCORM ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Szolasok_kozmondasok_2026_SCORM12
          path: Szolasok_kozmondasok_2026_SCORM12.zip
          if-no-files-found: error
