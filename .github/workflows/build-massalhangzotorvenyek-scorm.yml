name: Build Massalhangzotorvenyek SCORM

on:
  push:
    paths:
      - ".github/workflows/build-massalhangzotorvenyek-scorm.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble SCORM package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/massalhangzotorvenyek-scorm"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/categories/massalhangzotorvenyek"

          cp styles.css "$STAGE/"
          cp modules.css "$STAGE/"
          cp scorm.js "$STAGE/"
          cp categories/massalhangzotorvenyek/tasks.js "$STAGE/categories/massalhangzotorvenyek/"
          cp categories/massalhangzotorvenyek/app.js "$STAGE/categories/massalhangzotorvenyek/"

          cat > "$STAGE/launch-massalhangzotorvenyek.html" <<'EOF'
          <!doctype html>
          <html lang="hu">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Felvételi tréner – Mássalhangzótörvények</title>
            <link rel="stylesheet" href="styles.css">
            <link rel="stylesheet" href="modules.css">
          </head>
          <body>
            <div class="app-shell">
              <header class="topbar">
                <div>
                  <p class="eyebrow">Felvételi tréner</p>
                  <h1>Mássalhangzótörvények</h1>
                </div>
                <div class="scoreboard" aria-label="Haladás és pontszám" hidden>
                  <div><span id="progressText">0 / 0</span><small>feladat</small></div>
                  <div><span id="scoreText">0 / 0</span><small>eddigi pont</small></div>
                  <div><span id="totalText">0</span><small>összes pont</small></div>
                </div>
              </header>
              <div class="progress-track" aria-hidden="true" hidden><div id="progressBar"></div></div>
              <main id="app" class="card" aria-live="polite"></main>
            </div>

            <script>
              window.MASSALHANGZO_SCORM_STANDALONE = true;
            </script>
            <script src="scorm.js"></script>
            <script src="categories/massalhangzotorvenyek/tasks.js"></script>
            <script src="categories/massalhangzotorvenyek/app.js"></script>
          </body>
          </html>
          EOF

          cat > "$STAGE/imsmanifest.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest identifier="felveteli-trener-massalhangzotorvenyek"
            version="1.0"
            xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2"
            xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://www.imsproject.org/xsd/imscp_rootv1p1p2 imscp_rootv1p1p2.xsd
                                http://www.adlnet.org/xsd/adlcp_rootv1p2 adlcp_rootv1p2.xsd">
            <organizations default="ORG1">
              <organization identifier="ORG1">
                <title>Felvételi tréner – Mássalhangzótörvények</title>
                <item identifier="ITEM1" identifierref="RES1">
                  <title>Mássalhangzótörvények</title>
                </item>
              </organization>
            </organizations>
            <resources>
              <resource identifier="RES1" type="webcontent" adlcp:scormtype="sco" href="launch-massalhangzotorvenyek.html">
                <file href="launch-massalhangzotorvenyek.html"/>
                <file href="styles.css"/>
                <file href="modules.css"/>
                <file href="scorm.js"/>
                <file href="categories/massalhangzotorvenyek/tasks.js"/>
                <file href="categories/massalhangzotorvenyek/app.js"/>
              </resource>
            </resources>
          </manifest>
          EOF

          cd "$STAGE"
          zip -r "$GITHUB_WORKSPACE/Massalhangzotorvenyek_SCORM12.zip" . -x "*.DS_Store"

      - name: Upload SCORM ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Massalhangzotorvenyek_SCORM12
          path: Massalhangzotorvenyek_SCORM12.zip
          if-no-files-found: error
