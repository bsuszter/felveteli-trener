<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Felvételi tréner – Helyesírás</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="learning.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Felvételi tréner</p>
        <h1>Helyesírás</h1>
      </div>
      <div class="scoreboard" aria-label="Haladás és pontszám">
        <div><span id="progressText">0 / 12</span><small>feladat</small></div>
        <div><span id="scoreText">0 / 0</span><small>eddigi pont</small></div>
        <div><span>12</span><small>összes pont</small></div>
      </div>
    </header>

    <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>

    <main id="app" class="card" aria-live="polite"></main>
  </div>

  <script src="tasks.js"></script>
  <script src="practice.js"></script>
  <script src="scorm.js"></script>
  <script src="app.js"></script>
</body>
</html>
